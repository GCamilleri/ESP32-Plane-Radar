# Tag a release (v1.0.0) to attach firmware to GitHub Releases and publish the
# browser-based one-click installer to GitHub Pages.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build and merge
        env:
          # Baked into public releases so a web-flashed radar has working social tags
          # with no configuration at all. Not a secret, it is public DNS, and the
          # server is deliberately open with abuse bounded by per-device tag caps and
          # an upstream fetch limiter rather than by keeping an address quiet.
          #
          # The `local` env is the same build as `supermini` plus this URL. A plain
          # `pio run` still produces a keyless, serverless firmware, which is what a
          # contributor building from source should get.
          #
          # Consequence worth knowing: every device flashed from a release points here
          # permanently. If this host goes away those radars fall back to fetching
          # adsb.fi directly, so they keep working, but their tags go quiet and only a
          # reflash can move them.
          RADAR_FEED_URL: https://radar.giannicamilleri.com
        run: |
          pio run -e local
          pio run -t merge -e local

      - name: Package release files
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="manual-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          # Full image for fresh installs (flash at 0x0). Resets all settings.
          cp .pio/build/local/firmware-merged.bin "dist/plane-radar-${VERSION}.bin"
          sha256sum "dist/plane-radar-${VERSION}.bin" > "dist/plane-radar-${VERSION}.bin.sha256"
          # App-only image for updates that keep settings (flash at 0x10000). Used
          # by both the CLI and the web installer's "Update" button.
          cp .pio/build/local/firmware.bin "dist/plane-radar-app-${VERSION}.bin"
          sha256sum "dist/plane-radar-app-${VERSION}.bin" > "dist/plane-radar-app-${VERSION}.bin.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build versioned installer site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p site/firmware
          cp web/index.html site/index.html
          # Rebuild the whole firmware tree from every release's existing assets
          # (full merged image + app-only image). Browsers cannot fetch release
          # assets (no CORS), so we host each version on Pages instead. Doing it
          # from the release list means old versions accumulate automatically.
          versions=()
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                         --json tagName --jq '.[].tagName' | grep '^v' || true); do
            dir="site/firmware/$tag"
            mkdir -p "$dir"
            if gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                 --pattern "plane-radar-${tag}.bin" --output "$dir/full.bin" --clobber 2>/dev/null; then
              # Install (fresh): full merged image at 0x0. No new_install_prompt_erase
              # means ESP Web Tools full-erases first, so this is a clean wipe+install.
              printf '{"name":"Plane Radar","version":"%s","builds":[{"chipFamily":"ESP32-C3","parts":[{"path":"full.bin","offset":0}]}]}\n' "$tag" > "$dir/manifest-full.json"
              if gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                   --pattern "plane-radar-app-${tag}.bin" --output "$dir/app.bin" --clobber 2>/dev/null; then
                # Update (keep settings): app-only image at 0x10000. new_install_prompt_erase
                # true makes the erase choice default to OFF, so it flashes only the app and
                # leaves the NVS settings partition (0x9000) intact. Never auto-erases.
                printf '{"name":"Plane Radar","version":"%s","new_install_prompt_erase":true,"builds":[{"chipFamily":"ESP32-C3","parts":[{"path":"app.bin","offset":65536}]}]}\n' "$tag" > "$dir/manifest-keep.json"
              fi
              versions+=("$tag")
            else
              rmdir "$dir" 2>/dev/null || true
            fi
          done
          # "latest" alias so the page has a stable fallback if versions.json fails.
          # printf runs its format once even with no arguments, so an empty array
          # would emit a blank line and publish [""] -- which index.html accepts as
          # a real version and then wires both install buttons to no manifest.
          if [ ${#versions[@]} -eq 0 ]; then
            echo "::error::No release produced a flashable asset; refusing to publish an empty installer"
            exit 1
          fi
          cp -r "site/firmware/${versions[0]}" "site/firmware/latest"
          printf '%s\n' "${versions[@]}" | jq -R . | jq -s . > site/versions.json
          echo "Published versions:" && cat site/versions.json

      - name: Vendor esp-web-tools (self-hosted; no runtime CDN)
        run: |
          npm install --prefix /tmp/ewt esp-web-tools@10.4.0 --no-save
          mkdir -p site/vendor/esp-web-tools
          cp -r /tmp/ewt/node_modules/esp-web-tools/dist/* site/vendor/esp-web-tools/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
