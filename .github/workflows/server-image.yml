name: Server image

# Publishes the self-hosted feed server to GHCR so Unraid can pull a tagged image
# instead of building on the box. Only runs when the server actually changes.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-image.yml'
    tags: ['v*']
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/plane-radar-feed

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
        working-directory: server
      - run: npx tsc --noEmit
        working-directory: server

  smoke:
    # Catches the class of failure that typecheck cannot: Node runs these .ts files
    # by stripping types, and some valid TypeScript (parameter properties, enums)
    # is unsupported in that mode and only fails at startup.
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Boot the server and exercise the API
        working-directory: server
        env:
          DB_PATH: /tmp/smoke.db
          PORT: '8787'
        run: |
          node src/index.ts &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8787/healthz >/dev/null && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8787/healthz
          curl -fsS -X POST http://127.0.0.1:8787/v1/register \
            -d 'dev=aabbccddeeff&secret=00112233445566778899aabbccddeeff&handle=CIAO' \
            | grep -q 'handle=CIAO'
          curl -fsS http://127.0.0.1:8787/v1/tags | grep -q '^PR1 '
          echo 'smoke ok'

  image:
    runs-on: ubuntu-latest
    needs: smoke
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: server
          # arm64 as well as amd64: the image has no native modules, so a second
          # architecture costs nothing but makes it portable to an ARM box.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
