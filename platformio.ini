; ESP32-C3 Super Mini + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"

[platformio]
default_envs = supermini

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts =
  pre:scripts/build_version.py
  post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

; On-device testing against a Worker running on the dev machine:
;
;   cd worker && npx wrangler dev --ip 0.0.0.0
;   RADAR_FEED_URL=http://<your-lan-ip>:8787 pio run -e local -t upload
;
; The URL is taken from the environment so no machine-specific address ends up in
; the repository. Unset, it builds identically to `supermini` (proxy disabled).
[env:local]
extends = env:supermini
build_flags =
  ${env:supermini.build_flags}
  -DRADAR_FEED_PROXY_URL='"${sysenv.RADAR_FEED_URL}"'

; Host unit tests: pio test -e native. Runs on the CI runner, no hardware.
; Builds only the pure-logic sources it needs (see build_src_filter); the
; hardware-coupled state accessors those pull in are stubbed in test/native.
[env:native]
platform = native
test_framework = doctest
build_flags = -std=gnu++17
lib_deps = bblanchon/ArduinoJson@^7.4.2
test_build_src = true
build_src_filter =
  -<*>
  +<services/adsb_parse.cpp>
  +<services/adsb_feed.cpp>
  +<ui/radar_geo.cpp>
