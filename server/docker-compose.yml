services:
  plane-radar-feed:
    # Built and published by .github/workflows/server-image.yml.
    # Swap to `build: .` if you would rather build on the box than pull.
    image: ghcr.io/gcamilleri/plane-radar-feed:latest
    container_name: plane-radar-feed
    restart: unless-stopped
    ports:
      # Your reverse proxy points at this. Bind to the LAN address rather than
      # 0.0.0.0 if you want to be sure nothing but the proxy can reach it.
      - "8787:8787"
    volumes:
      # Device registrations live here. Lose this and every radar re-registers,
      # which changes their handles and so the colour every other radar draws
      # for them.
      - ./data:/data
    environment:
      # Ownership of the mounted volume, fixed up at container start. A bind mount
      # arrives owned by the host, so this cannot be settled in the image. 99:100 is
      # Unraid's nobody:users; on other hosts use the owner of ./data.
      PUID: "99"
      PGID: "100"
      # How long a claim is exclusive. Tags themselves do not expire: after this,
      # another radar may take the aircraft over, and until then nobody can.
      LOCK_SECONDS: "3600"
      # Aircraft one device may hold tags on at once. A released tag frees its slot
      # immediately, as does one another radar takes over.
      MAX_TAGS_PER_DEVICE: "10"
      # Floor on how often one map cell can hit adsb.fi. The hard ceiling is
      # UPSTREAM_MIN_INTERVAL_MS below; this just keeps popular cells cheap.
      FEED_CACHE_SECONDS: "4"
      # adsb.fi allows 1 request/second per IP and every fetch here comes from one
      # address, so this is the limit that protects something we do not control.
      UPSTREAM_MIN_INTERVAL_MS: "1000"
      REGISTRATIONS_PER_HOUR_PER_IP: "5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
