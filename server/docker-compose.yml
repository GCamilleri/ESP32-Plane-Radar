services:
  plane-radar-feed:
    # Swap to `build: .` if you would rather build on the box than pull.
    image: ghcr.io/gcamilleri/plane-radar-feed:latest
    container_name: plane-radar-feed
    restart: unless-stopped
    ports:
      # Radars on the LAN connect here over plain HTTP. The port has to be
      # published even when a tunnel is used, so local radars keep working when
      # your internet does not.
      - "8787:8787"
    volumes:
      # Device registrations live here. Lose this and every radar re-registers,
      # which changes their handles and therefore their tag colours.
      - ./data:/data
    environment:
      LOCK_SECONDS: "1800"
      CLAIMS_PER_HOUR: "10"
      MAX_ACTIVE_TAGS: "64"
      # Floor on how often one map cell can hit adsb.fi, whose public limit is
      # 1 request/second per IP. Raise it if you add radars in scattered places.
      FEED_CACHE_SECONDS: "4"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: reach the feed from outside the house over HTTPS, without opening a
  # port or having a static IP. Create the tunnel in the Cloudflare Zero Trust
  # dashboard, point its public hostname at http://plane-radar-feed:8787, and put
  # the token in .env as TUNNEL_TOKEN. Delete this service for LAN-only.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: plane-radar-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env or remove this service}"
    depends_on:
      - plane-radar-feed
